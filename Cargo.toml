[package]
name = "arr"
version = "0.15.1"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Standalone movie/TV API server: native TPB/Torznab indexers, embedded BitTorrent engine, verified import into your Plex library, managed setup, remote MCP; optional Prowlarr and qBittorrent (shadow by default)"

[features]
# An in-memory download client for the integration tests (`Client::Fake`, selected by a
# `[test_client]` config section). Not a default feature and never in a release build; the
# self dev-dependency below enables it for `cargo test`.
test-client = []

[dependencies]
anyhow = "1"
base64 = "0.23"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "form", "tokio", "tracing"] }
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
regex = "1.13"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "form", "gzip"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "reqwest", "rustls"] }
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "io-util", "fs"] }
toml = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
arr = { path = ".", features = ["test-client"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3"

[profile.release]
strip = true
