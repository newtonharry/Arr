name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and ffmpeg
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy
          rustup default 1.94.1
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # install.sh and uninstall.sh as a user runs them (sudo, systemd), with remote access.
      - name: Installer
        run: |
          cargo build --release --locked
          sh tests/installer/linux.sh

  # The macOS installer path: the real "Install Plex for me", install.sh with remote access
  # (launchd), and uninstalling Arr and Plex while keeping media.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and FFmpeg
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
          brew install ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-macos-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked
      - name: Installer
        run: sh tests/installer/macos.sh

  windows:
    runs-on: windows-2025
    steps:
      # Keep LF line endings: tests compare files byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install Rust and FFmpeg
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy
          rustup default 1.94.1
          choco install ffmpeg -y --no-progress
          # Chocolatey's ffprobe is a launcher that starts the real one as a second process,
          # which Arr's one-process sandbox refuses: put the real folder first on the PATH.
          $ff = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          $ff.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # install.ps1 the way users run it (irm | iex), in Windows PowerShell 5.1, against a
      # release zip built here: download, checksum, install, PATH.
      - name: Installer
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          cargo build --release --locked
          if ($LASTEXITCODE) { exit 1 }
          $name = 'arr-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item target\release\arr.exe, target\release\arr-background.exe "dist\$name"
          Compress-Archive "dist\$name" "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content "dist\$name.zip.sha256" "$hash  $name.zip"
          Start-Process python -ArgumentList '-m', 'http.server', '8999', '--bind', '127.0.0.1', '--directory', 'dist'
          Start-Sleep -Seconds 3
          $env:ARR_DOWNLOAD_BASE = 'http://127.0.0.1:8999'
          $env:ARR_BIN_DIR = "$env:RUNNER_TEMP\arr bin"
          $env:ARR_NO_SETUP = '1'
          $env:ARR_INSTALL_STRICT = '1'
          Get-Content install.ps1 -Raw | Invoke-Expression
          & "$env:ARR_BIN_DIR\arr.exe" --version
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process "$env:ARR_BIN_DIR\arr-background.exe" -ArgumentList '--hidden', 'cmd.exe', '/c', 'exit 7' -Wait -PassThru
          if ($p.ExitCode -ne 7) { "arr-background --hidden exited with $($p.ExitCode)"; exit 1 }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -notcontains $env:ARR_BIN_DIR) { "not on PATH: $path"; exit 1 }
          # Running again replaces the files in place, keeping the old ones to go back to.
          Get-Content install.ps1 -Raw | Invoke-Expression
          if (-not (Test-Path "$env:ARR_BIN_DIR\arr-background.exe.previous")) { 'no .previous kept'; exit 1 }
          # And the uninstaller takes it all away again.
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\uninstall.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          $env:ARR_YES = '1'; $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          if (Test-Path $env:ARR_BIN_DIR) { "still there: $env:ARR_BIN_DIR"; exit 1 }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -contains $env:ARR_BIN_DIR) { "still on PATH: $path"; exit 1 }
      # The real Plex install the setup page runs (this runner is an administrator, so
      # Windows doesn't need to ask), then the uninstaller removes Plex again.
      - name: Plex install and removal
        shell: powershell
        run: |
          $out = & target\release\arr.exe plex-install 2>&1
          $out
          if ($LASTEXITCODE) { exit 1 }
          if (-not ($out -match '^step: Installing Plex Media Server')) { 'no install step reported'; exit 1 }
          $id = $null
          for ($i = 0; $i -lt 60 -and -not $id; $i++) {
            try { $id = Invoke-RestMethod http://127.0.0.1:32400/identity -Headers @{ Accept = 'application/json' } -TimeoutSec 3 } catch { Start-Sleep 2 }
          }
          if (-not $id) { 'Plex never answered on 32400'; exit 1 }
          "Plex $($id.MediaContainer.version) is running, claimed: $($id.MediaContainer.claimed)"
          foreach ($d in 'Movies', 'TV Shows') { if (-not (Test-Path "$env:USERPROFILE\Media\$d")) { "no $d folder"; exit 1 } }
          $env:ARR_YES = '1'; $env:ARR_REMOVE = 'plex'; $env:ARR_DELETE_DATA = '1'; $env:ARR_INSTALL_STRICT = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          $left = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Plex Media Server*' }
          if ($left) { 'Plex is still installed'; exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\Media\Movies")) { 'the media folder was removed'; exit 1 }
      # Remote access the way an agent sets it up (every value from the environment), with
      # the real ngrok agent but a made-up account: everything up to the public check runs
      # for real, and the check must fail pointing at the tunnel's log.
      - name: Remote access (ngrok and Google sign-in)
        shell: powershell
        run: |
          function Fail($m) { "FAIL: $m"; exit 1 }
          $name = 'arr-x86_64-pc-windows-msvc'
          Start-Process python -ArgumentList '-m', 'http.server', '8998', '--bind', '127.0.0.1', '--directory', 'dist'
          Start-Sleep -Seconds 3
          $state = "$env:RUNNER_TEMP\arr remote state"
          $bin = "$env:RUNNER_TEMP\arr remote bin"
          & target\release\arr.exe init --state-dir $state | Out-Null
          $env:ARR_DOWNLOAD_BASE = 'http://127.0.0.1:8998'
          $env:ARR_BIN_DIR = $bin; $env:ARR_STATE_DIR = $state
          $env:ARR_YES = '1'; $env:ARR_AUTO_UPDATE = '0'; $env:ARR_INSTALL_STRICT = '1'
          $env:ARR_REMOTE_CHECK_SECONDS = '20'
          $env:ARR_NGROK_TOKEN = '2abcDEF_ciNotARealToken'
          $env:ARR_NGROK_DOMAIN = 'https://Arr-CI-Test.ngrok-free.app/'
          $env:ARR_GOOGLE_CLIENT_ID = '123-ci.apps.googleusercontent.com'
          $env:ARR_GOOGLE_CLIENT_SECRET = 'GOCSPX-ci_secret'
          $env:ARR_ALLOW_EMAILS = 'CI@Example.com, other@example.com'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "install said: $msg"
          if (-not $msg) { Fail 'the public check passed with a made-up ngrok account' }
          if ($msg -notmatch [regex]::Escape("$state\tunnel.log")) { Fail "the failure doesn't point at the tunnel log" }
          $config = Get-Content "$state\config.toml" -Raw
          foreach ($want in 'public_url = "https://arr-ci-test.ngrok-free.app"',
              'allowed_emails = ["ci@example.com", "other@example.com"]',
              'allowed_hosts = ["arr-ci-test.ngrok-free.app", "localhost", "127.0.0.1"]',
              'google_client_secret_file = "secrets/google_client_secret"') {
            if (-not $config.Contains($want)) { Fail "config lacks $want" }
          }
          if ($config.Contains('GOCSPX')) { Fail 'the client secret is in the config' }
          $check = & "$bin\arr.exe" check --config "$state\config.toml" | Out-String | ConvertFrom-Json
          if (-not $check.mcp_enabled) { Fail 'arr check: MCP is off' }
          if ([IO.File]::ReadAllText("$state\secrets\google_client_secret") -ne 'GOCSPX-ci_secret') { Fail 'client secret file' }
          $yml = Get-Content "$state\ngrok.yml" -Raw
          if ($yml -notmatch 'web_addr: false' -or $yml -notmatch '2abcDEF_ciNotARealToken') { Fail "ngrok.yml: $yml" }
          if (-not (Test-Path "$bin\ngrok.exe")) { Fail 'ngrok was not installed' }
          # Only you, Windows and administrators can open Arr's folder.
          $acl = (Get-Acl $state).Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl | Where-Object { $_ -match 'Users$|Everyone' }) { Fail "state folder is shared: $($acl -join ', ')" }
          $task = Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue
          if (-not $task) { Fail 'no Arr tunnel task' }
          $a = $task.Actions[0]
          "tunnel task: $($a.Execute) $($a.Arguments)"
          if ($a.Execute -ne "$bin\arr-background.exe" -or $a.Arguments -notmatch '--hidden' -or
              $a.Arguments -notmatch [regex]::Escape('--url=https://arr-ci-test.ngrok-free.app')) { Fail 'tunnel task action' }
          if ($task.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger') { Fail 'the tunnel does not start at log-on' }
          if (-not (Test-Path "$state\tunnel.log") -or -not (Get-Content "$state\tunnel.log" -Raw)) { Fail 'ngrok wrote no log' }
          "tunnel.log:"; Get-Content "$state\tunnel.log" | Select-Object -First 5
          # A rerun keeps remote access as it is.
          $before = $config
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { "rerun said: $($_.Exception.Message)" }
          if ((Get-Content "$state\config.toml" -Raw) -ne $before) { Fail 'a rerun changed the config' }
          if (-not (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue)) { Fail 'a rerun lost the tunnel task' }
          function ArrPid {
            Get-CimInstance Win32_Process -Filter "Name LIKE 'arr-background%'" |
              Where-Object { $_.CommandLine -like '*--config*' -and $_.CommandLine -notlike '*--hidden*' } | ForEach-Object { $_.ProcessId }
          }
          function Healthy { try { [bool](Invoke-RestMethod http://127.0.0.1:8787/api/v1/health -TimeoutSec 5) } catch { $false } }
          if (-not (Healthy) -or -not (ArrPid)) { Fail 'Arr is not running after a rerun' }
          # A setting given on a rerun is applied; the rest are kept.
          $env:ARR_ERROR_REPORTS = '0'
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { "error reports rerun said: $($_.Exception.Message)" }
          $env:ARR_ERROR_REPORTS = $null
          if ((Get-Content "$state\config.toml" -Raw) -notmatch '(?m)^\[reporting\]\r?\nenabled = false') { Fail 'ARR_ERROR_REPORTS was not applied' }
          if (-not (Healthy)) { Fail 'Arr is not running after the error reports rerun' }
          # A rerun that fails leaves Arr running as it was: a refused option, then a broken config.
          $running = ArrPid
          $good = [IO.File]::ReadAllText("$state\config.toml")
          $env:ARR_TORRENT_PORT = '70000'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          $env:ARR_TORRENT_PORT = $null
          "bad option said: $msg"
          if ($msg -notmatch 'ARR_TORRENT_PORT') { Fail 'ARR_TORRENT_PORT=70000 was not refused' }
          [IO.File]::AppendAllText("$state\config.toml", "`n[[[ not toml`n")
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          [IO.File]::WriteAllText("$state\config.toml", $good)
          "broken config said: $msg"
          if ($msg -notmatch 'keeps running') { Fail 'a broken config did not stop the rerun' }
          if (-not (Healthy) -or "$(ArrPid)" -ne "$running") { Fail 'a failed rerun stopped or restarted Arr' }
          # Uninstalled but data kept, then installed again: ngrok and the tunnel come back.
          $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '0'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          if (Test-Path "$bin\ngrok.exe") { Fail 'uninstall left ngrok behind' }
          if (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue) { Fail 'uninstall left the tunnel task' }
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { "reinstall said: $($_.Exception.Message)" }
          if (-not (Test-Path "$bin\ngrok.exe")) { Fail 'the reinstall did not bring ngrok back' }
          if (-not (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue)) { Fail 'the reinstall did not bring the tunnel back' }
          # Uninstalling takes the tunnel with it.
          $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          if (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue) { Fail 'the tunnel task is still there' }
          $ng = Get-CimInstance Win32_Process -Filter "Name = 'ngrok.exe'" | Where-Object { $_.CommandLine -and $_.CommandLine.Contains($state) }
          if ($ng) { Fail 'ngrok is still running' }
          if (Test-Path $bin) { Fail 'the program folder is still there' }
          if (Test-Path $state) { Fail 'the state folder is still there' }
          'remote access: all checks passed'
