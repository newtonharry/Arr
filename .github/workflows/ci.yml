name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and ffmpeg
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy
          rustup default 1.94.1
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # install.sh and uninstall.sh as a user runs them (sudo, systemd), with remote access.
      - name: Installer
        run: |
          cargo build --release --locked
          sh tests/installer/linux.sh
      # Starting at boot, with stand-ins for what only a Mac or an administrator has (launchd,
      # sudo, loginctl): which kind of install is chosen, when a password may be asked for, and
      # that the updater restarts and rolls back without one. The real thing runs in the macos
      # and windows jobs.
      - name: Installer, start at boot (with stand-ins)
        run: |
          sh tests/installer/macos-boot.sh target/release/arr
          sh tests/installer/linger.sh target/release/arr
          sh tests/installer/update-now.sh target/release/arr
      # How the first setup is chosen (web page or terminal) and run, with a stand-in arr.
      - name: Installer, first setup choice (with stand-ins)
        run: sh tests/installer/setup-choice.sh
      # Auto-update rolls back to the previous binary when the new one is not healthy, so the
      # latest published release must still start on what this build (its install.sh, its setup
      # page, its API) wrote, and back.
      - name: Rollback to the latest release
        env:
          ARR_CARGO_FLAGS: --locked
          # Signed-in downloads keep working when GitHub's anonymous downloads are timing out.
          GH_TOKEN: ${{ github.token }}
        run: sh tests/upgrade/rollback.sh target/release/arr

  # The macOS installer path: the real "Install Plex for me", install.sh with remote access
  # (launchd), and uninstalling Arr and Plex while keeping media.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and FFmpeg
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
          brew install ffmpeg
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-macos-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked
      - name: Installer
        run: sh tests/installer/macos.sh

  windows:
    runs-on: windows-2025
    steps:
      # Keep LF line endings: tests compare files byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install Rust and FFmpeg
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy
          rustup default 1.94.1
          choco install ffmpeg -y --no-progress
          # Chocolatey's ffprobe is a launcher that starts the real one as a second process,
          # which Arr's one-process sandbox refuses: put the real folder first on the PATH.
          $ff = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          $ff.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # install.ps1 the way users run it (irm | iex), in Windows PowerShell 5.1, against a
      # release zip built here: download, checksum, install, PATH.
      - name: Installer
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          cargo build --release --locked
          if ($LASTEXITCODE) { exit 1 }
          $name = 'arr-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item target\release\arr.exe, target\release\arr-background.exe "dist\$name"
          Compress-Archive "dist\$name" "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content "dist\$name.zip.sha256" "$hash  $name.zip"
          Start-Process python -ArgumentList '-m', 'http.server', '8999', '--bind', '127.0.0.1', '--directory', 'dist'
          Start-Sleep -Seconds 3
          $env:ARR_DOWNLOAD_BASE = 'http://127.0.0.1:8999'
          $env:ARR_BIN_DIR = "$env:RUNNER_TEMP\arr bin"
          $env:ARR_NO_SETUP = '1'
          $env:ARR_INSTALL_STRICT = '1'
          Get-Content install.ps1 -Raw | Invoke-Expression
          & "$env:ARR_BIN_DIR\arr.exe" --version
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process "$env:ARR_BIN_DIR\arr-background.exe" -ArgumentList '--hidden', 'cmd.exe', '/c', 'exit 7' -Wait -PassThru
          if ($p.ExitCode -ne 7) { "arr-background --hidden exited with $($p.ExitCode)"; exit 1 }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -notcontains $env:ARR_BIN_DIR) { "not on PATH: $path"; exit 1 }
          # Running again replaces the files in place, keeping the old ones to go back to.
          Get-Content install.ps1 -Raw | Invoke-Expression
          if (-not (Test-Path "$env:ARR_BIN_DIR\arr-background.exe.previous")) { 'no .previous kept'; exit 1 }
          # And the uninstaller takes it all away again.
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\uninstall.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          $env:ARR_YES = '1'; $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          if (Test-Path $env:ARR_BIN_DIR) { "still there: $env:ARR_BIN_DIR"; exit 1 }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if (($path -split ';') -contains $env:ARR_BIN_DIR) { "still on PATH: $path"; exit 1 }
      # The real Plex install the setup page runs (this runner is an administrator, so
      # Windows doesn't need to ask), then the uninstaller removes Plex again.
      - name: Plex install and removal
        shell: powershell
        run: |
          $out = & target\release\arr.exe plex-install 2>&1
          $out
          if ($LASTEXITCODE) { exit 1 }
          if (-not ($out -match '^step: Installing Plex Media Server')) { 'no install step reported'; exit 1 }
          $id = $null
          for ($i = 0; $i -lt 60 -and -not $id; $i++) {
            try { $id = Invoke-RestMethod http://127.0.0.1:32400/identity -Headers @{ Accept = 'application/json' } -TimeoutSec 3 } catch { Start-Sleep 2 }
          }
          if (-not $id) { 'Plex never answered on 32400'; exit 1 }
          "Plex $($id.MediaContainer.version) is running, claimed: $($id.MediaContainer.claimed)"
          foreach ($d in 'Movies', 'TV Shows') { if (-not (Test-Path "$env:USERPROFILE\Media\$d")) { "no $d folder"; exit 1 } }
          $env:ARR_YES = '1'; $env:ARR_REMOVE = 'plex'; $env:ARR_DELETE_DATA = '1'; $env:ARR_INSTALL_STRICT = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          $left = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Plex Media Server*' }
          if ($left) { 'Plex is still installed'; exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\Media\Movies")) { 'the media folder was removed'; exit 1 }
      # Remote access the way an agent sets it up (every value from the environment), with
      # the real ngrok agent but a made-up account: everything up to the public check runs
      # for real, and the check must fail pointing at the tunnel's log.
      - name: Remote access (ngrok and Google sign-in)
        shell: powershell
        run: |
          function Fail($m) { "FAIL: $m"; exit 1 }
          $name = 'arr-x86_64-pc-windows-msvc'
          Start-Process python -ArgumentList '-m', 'http.server', '8998', '--bind', '127.0.0.1', '--directory', 'dist'
          Start-Sleep -Seconds 3
          $state = "$env:RUNNER_TEMP\arr remote state"
          $bin = "$env:RUNNER_TEMP\arr remote bin"
          & target\release\arr.exe init --state-dir $state | Out-Null
          $env:ARR_DOWNLOAD_BASE = 'http://127.0.0.1:8998'
          $env:ARR_BIN_DIR = $bin; $env:ARR_STATE_DIR = $state
          $env:ARR_YES = '1'; $env:ARR_AUTO_UPDATE = '0'; $env:ARR_INSTALL_STRICT = '1'
          $env:ARR_REMOTE_CHECK_SECONDS = '20'
          $env:ARR_NGROK_TOKEN = '2abcDEF_ciNotARealToken'
          $env:ARR_NGROK_DOMAIN = 'https://Arr-CI-Test.ngrok-free.app/'
          $env:ARR_GOOGLE_CLIENT_ID = '123-ci.apps.googleusercontent.com'
          $env:ARR_GOOGLE_CLIENT_SECRET = 'GOCSPX-ci_secret'
          $env:ARR_ALLOW_EMAILS = 'CI@Example.com, other@example.com'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "install said: $msg"
          if (-not $msg) { Fail 'the public check passed with a made-up ngrok account' }
          if ($msg -notmatch [regex]::Escape("$state\tunnel.log")) { Fail "the failure doesn't point at the tunnel log" }
          $config = Get-Content "$state\config.toml" -Raw
          foreach ($want in 'public_url = "https://arr-ci-test.ngrok-free.app"',
              'allowed_emails = ["ci@example.com", "other@example.com"]',
              'allowed_hosts = ["arr-ci-test.ngrok-free.app", "localhost", "127.0.0.1"]',
              'google_client_secret_file = "secrets/google_client_secret"') {
            if (-not $config.Contains($want)) { Fail "config lacks $want" }
          }
          if ($config.Contains('GOCSPX')) { Fail 'the client secret is in the config' }
          $check = & "$bin\arr.exe" check --config "$state\config.toml" | Out-String | ConvertFrom-Json
          if (-not $check.mcp_enabled) { Fail 'arr check: MCP is off' }
          if ([IO.File]::ReadAllText("$state\secrets\google_client_secret") -ne 'GOCSPX-ci_secret') { Fail 'client secret file' }
          $yml = Get-Content "$state\ngrok.yml" -Raw
          if ($yml -notmatch 'web_addr: false' -or $yml -notmatch '2abcDEF_ciNotARealToken') { Fail "ngrok.yml: $yml" }
          if (-not (Test-Path "$bin\ngrok.exe")) { Fail 'ngrok was not installed' }
          # Only you, Windows and administrators can open Arr's folder.
          $acl = (Get-Acl $state).Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl | Where-Object { $_ -match 'Users$|Everyone' }) { Fail "state folder is shared: $($acl -join ', ')" }
          $task = Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue
          if (-not $task) { Fail 'no Arr tunnel task' }
          $a = $task.Actions[0]
          "tunnel task: $($a.Execute) $($a.Arguments)"
          if ($a.Execute -ne "$bin\arr-background.exe" -or $a.Arguments -notmatch '--hidden' -or
              $a.Arguments -notmatch [regex]::Escape('--url=https://arr-ci-test.ngrok-free.app')) { Fail 'tunnel task action' }
          if ($task.Triggers[0].CimClass.CimClassName -ne 'MSFT_TaskLogonTrigger') { Fail 'the tunnel does not start at log-on' }
          if (-not (Test-Path "$state\tunnel.log") -or -not (Get-Content "$state\tunnel.log" -Raw)) { Fail 'ngrok wrote no log' }
          "tunnel.log:"; Get-Content "$state\tunnel.log" | Select-Object -First 5
          # A rerun keeps remote access as it is.
          $before = $config
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "rerun said: $msg"
          # The made-up ngrok account fails only the last step, the public check.
          if ($msg -notlike "*doesn't reach Arr yet*") { Fail "the rerun failed before the public check: $msg" }
          if ((Get-Content "$state\config.toml" -Raw) -ne $before) { Fail 'a rerun changed the config' }
          if (-not (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue)) { Fail 'a rerun lost the tunnel task' }
          # This install's Arr (not any other on the runner): its command line names this config.
          function ArrPid {
            Get-CimInstance Win32_Process -Filter "Name LIKE 'arr-background%'" |
              Where-Object { "$($_.CommandLine)".Contains("$state\config.toml") -and $_.CommandLine -notlike '*--hidden*' } | ForEach-Object { $_.ProcessId }
          }
          function Healthy { try { [bool](Invoke-RestMethod http://127.0.0.1:8787/api/v1/health -TimeoutSec 5) } catch { $false } }
          if (-not (Healthy) -or -not (ArrPid)) { Fail 'Arr is not running after a rerun' }
          # A setting given on a rerun is applied; the rest are kept. Without ARR_BIN_DIR the
          # program folder still comes from the Arr task (only ARR_STATE_DIR is given).
          $env:ARR_ERROR_REPORTS = '0'; $env:ARR_BIN_DIR = $null
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "error reports rerun said: $msg"
          if ($msg -notlike "*doesn't reach Arr yet*") { Fail "the error reports rerun failed before the public check: $msg" }
          $env:ARR_ERROR_REPORTS = $null; $env:ARR_BIN_DIR = $bin
          if ((Get-ScheduledTask -TaskName 'Arr').Actions[0].Execute -ne "$bin\arr-background.exe") { Fail 'ARR_STATE_DIR alone moved the program folder' }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Arr\arr.exe") { Fail 'ARR_STATE_DIR alone installed to the default folder' }
          if ((Get-Content "$state\config.toml" -Raw) -notmatch '(?m)^\[reporting\]\r?\nenabled = false') { Fail 'ARR_ERROR_REPORTS was not applied' }
          if (-not (Healthy)) { Fail 'Arr is not running after the error reports rerun' }
          # A rerun that fails leaves Arr running as it was: a refused option, then a broken config.
          $running = ArrPid
          $good = [IO.File]::ReadAllText("$state\config.toml")
          $env:ARR_TORRENT_PORT = '70000'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          $env:ARR_TORRENT_PORT = $null
          "bad option said: $msg"
          if ($msg -notmatch 'ARR_TORRENT_PORT') { Fail 'ARR_TORRENT_PORT=70000 was not refused' }
          $env:ARR_PORT = '8788'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          $env:ARR_PORT = $null
          "other port said: $msg"
          if ($msg -notmatch 'ARR_PORT') { Fail 'a different ARR_PORT with ARR_YES was not refused' }
          if (-not (Healthy) -or "$(ArrPid)" -ne "$running") { Fail 'a refused option stopped or restarted Arr' }
          [IO.File]::AppendAllText("$state\config.toml", "`n[[[ not toml`n")
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          [IO.File]::WriteAllText("$state\config.toml", $good)
          "broken config said: $msg"
          if ($msg -notmatch 'keeps running') { Fail 'a broken config did not stop the rerun' }
          if (-not (Healthy) -or "$(ArrPid)" -ne "$running") { Fail 'a failed rerun stopped or restarted Arr' }
          # ... and the previous programs are back in place, for Arr's next start.
          if (Test-Path "$bin\arr-background.exe.previous") { Fail 'the failed rerun left the new arr-background.exe in place' }
          # Uninstalled but data kept, then installed again: ngrok and the tunnel come back.
          $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '0'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          if (Test-Path "$bin\ngrok.exe") { Fail 'uninstall left ngrok behind' }
          if (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue) { Fail 'uninstall left the tunnel task' }
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { "reinstall said: $($_.Exception.Message)" }
          if (-not (Test-Path "$bin\ngrok.exe")) { Fail 'the reinstall did not bring ngrok back' }
          if (-not (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue)) { Fail 'the reinstall did not bring the tunnel back' }
          # Uninstalling takes the tunnel with it.
          $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          if (Get-ScheduledTask -TaskName 'Arr tunnel' -ErrorAction SilentlyContinue) { Fail 'the tunnel task is still there' }
          $ng = Get-CimInstance Win32_Process -Filter "Name = 'ngrok.exe'" | Where-Object { $_.CommandLine -and $_.CommandLine.Contains($state) }
          if ($ng) { Fail 'ngrok is still running' }
          if (Test-Path $bin) { Fail 'the program folder is still there' }
          if (Test-Path $state) { Fail 'the state folder is still there' }
          'remote access: all checks passed'
      # Starting at boot: the tasks are registered to run whether or not anyone is logged on, the
      # way a person gets them (ARR_AT_BOOT=1; this runner is an administrator, so the
      # elevation step runs in place), then a rerun with nobody to ask keeps them, restarts Arr
      # through the task, and the updater restarts Arr and rolls back the same way.
      - name: Start at boot
        shell: powershell
        run: |
          function Fail($m) { "FAIL: $m"; exit 1 }
          Start-Process python -ArgumentList '-m', 'http.server', '8996', '--bind', '127.0.0.1', '--directory', 'dist'
          # "v99.0.0" is served, but holds this build: Arr answers as the old version, so the
          # updater must put the old programs back and start them again.
          Start-Process python -ArgumentList 'tests\installer\relserver.py', '8995', 'dist'
          Start-Sleep -Seconds 3
          $state = "$env:RUNNER_TEMP\arr boot state"
          $bin = "$env:RUNNER_TEMP\arr boot bin"
          & target\release\arr.exe init --state-dir $state --listen 127.0.0.1:8790 | Out-Null
          $env:ARR_DOWNLOAD_BASE = 'http://127.0.0.1:8996'
          $env:ARR_BIN_DIR = $bin; $env:ARR_STATE_DIR = $state
          $env:ARR_YES = '1'; $env:ARR_AUTO_UPDATE = '1'; $env:ARR_INSTALL_STRICT = '1'; $env:ARR_AT_BOOT = '1'
          function Healthy { try { [bool](Invoke-RestMethod http://127.0.0.1:8790/api/v1/health -TimeoutSec 5) } catch { $false } }
          function ArrPid {
            Get-CimInstance Win32_Process -Filter "Name LIKE 'arr-background%'" |
              Where-Object { "$($_.CommandLine)".Contains("$state\config.toml") -and $_.CommandLine -notlike '*--hidden*' } | ForEach-Object { $_.ProcessId }
          }
          function CheckBootTasks($when) {
            foreach ($n in 'Arr', 'Arr update') {
              $t = Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue
              if (-not $t) { Fail "no $n task $when" }
              if ("$($t.Principal.LogonType)" -ne 'S4U') { Fail "the $n task is $($t.Principal.LogonType), not S4U $when" }
              if ("$($t.Principal.RunLevel)" -ne 'Limited') { Fail "the $n task isn't limited $when" }
            }
            $kinds = @((Get-ScheduledTask -TaskName 'Arr').Triggers | ForEach-Object { $_.CimClass.CimClassName })
            if ($kinds -notcontains 'MSFT_TaskBootTrigger' -or $kinds -notcontains 'MSFT_TaskLogonTrigger') { Fail "Arr's triggers $when are: $kinds" }
          }
          Get-Content install.ps1 -Raw | Invoke-Expression
          CheckBootTasks 'after ARR_AT_BOOT=1'
          if (-not (Healthy) -or -not (ArrPid)) { Fail 'Arr is not running from the boot task' }
          # Its own user may start and stop it (the updater and a rerun do, without administrator rights).
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $svc = New-Object -ComObject Schedule.Service; $svc.Connect()
          # (Only shown: the installer's own warning says if granting it failed; the restarts below work either way.)
          "Arr task security descriptor: $($svc.GetFolder('\').GetTask('Arr').GetSecurityDescriptor(4))"
          # A rerun with nobody to ask leaves the tasks as they are and restarts Arr through the task.
          $registered = (Get-ScheduledTask -TaskName 'Arr').Date
          $before = ArrPid
          $env:ARR_AT_BOOT = $null
          Get-Content install.ps1 -Raw | Invoke-Expression
          CheckBootTasks 'after an unattended rerun'
          if ((Get-ScheduledTask -TaskName 'Arr').Date -ne $registered) { Fail 'an unattended rerun registered the Arr task again' }
          if (-not (Healthy)) { Fail 'Arr does not answer after the unattended rerun' }
          if ("$(ArrPid)" -eq "$before" -or -not (ArrPid)) { Fail 'the unattended rerun did not restart Arr' }
          # The updater: swaps in v99.0.0, restarts Arr through the task, sees the old version answer, goes back.
          $hash = (Get-FileHash "$bin\arr.exe").Hash
          $before = ArrPid
          $env:ARR_RELEASES_URL = 'http://127.0.0.1:8995/releases'
          $out = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "$bin\arr-update.ps1" 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code -ne 1) { Fail "the updater exited with $code, not 1 (a version that never answered)" }
          if ($out -notmatch "v99\.0\.0 didn't start; going back") { Fail 'the updater did not roll back' }
          if ($out -match "didn't start either") { Fail 'the old version did not come back' }
          if ((Get-FileHash "$bin\arr.exe").Hash -ne $hash) { Fail 'the old arr.exe was not put back' }
          if (-not (Healthy)) { Fail 'Arr was left stopped by the rollback' }
          if ("$(ArrPid)" -eq "$before" -or -not (ArrPid)) { Fail 'the updater did not restart Arr' }
          CheckBootTasks 'after the updater'
          # "Update now" in the web app: the status the updater wrote (what the app shows), and
          # Arr's own way of starting the updater, which is to run its task as the task's user.
          $status = Get-Content "$state\update-status.json" -Raw | ConvertFrom-Json
          if ($status.state -ne 'failed' -or $status.to -ne '99.0.0') { Fail "update-status.json says: $($status | ConvertTo-Json -Compress)" }
          if ((Get-Content "$bin\arr-update.ps1" -Raw) -notmatch 'arr-update-trigger') { Fail 'the updater does not know about Update now' }
          $env:ARR_RELEASES_URL = $null
          schtasks /Run /TN 'Arr update' | Out-Null
          if ($LASTEXITCODE -ne 0) { Fail "schtasks /Run 'Arr update' failed ($LASTEXITCODE): the app could not start the updater" }
          # (The task would contact GitHub; this only proves the right to start it.)
          schtasks /End /TN 'Arr update' | Out-Null
          Start-Sleep -Seconds 2
          if (-not (Healthy)) { Fail 'Arr does not answer after starting the update task' }
          # ARR_AT_BOOT=0 with nobody to ask can't take the boot tasks away (that needs an administrator): they stay.
          $env:ARR_RELEASES_URL = $null; $env:ARR_AT_BOOT = '0'
          Get-Content install.ps1 -Raw | Invoke-Expression
          CheckBootTasks 'after ARR_AT_BOOT=0 without a prompt'
          if (-not (Healthy)) { Fail 'Arr does not answer after ARR_AT_BOOT=0' }
          $env:ARR_AT_BOOT = $null
          $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          foreach ($n in 'Arr', 'Arr update') { if (Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue) { Fail "uninstall left the $n task" } }
          'start at boot: all checks passed'
      # Two claims about a standard user. (1) Set-TaskMode refuses to register boot tasks for an
      # account other than the administrator's own (Windows wants that account's password for
      # S4U), and leaves the task at log-on. (2) A task an administrator registered for a user
      # with the full-control entry the installer adds can be stopped and started by that user
      # without administrator rights. The task here is registered at log-on (no S4U, no password)
      # for the other account; a stand-in program, not Arr, since only the task's rights are tested.
      - name: Start at boot, rights of an ordinary user
        shell: powershell
        run: |
          function Fail($m) { "FAIL: $m"; exit 1 }
          $text = Get-Content install.ps1 -Raw
          $i = $text.IndexOf("`ntry {`n`tInstall-Arr")
          if ($i -lt 0) { Fail 'cannot find the end of install.ps1' }
          Invoke-Expression $text.Substring(0, $i) # its functions, without running the installer
          $pw = 'Arr-ci-' + [guid]::NewGuid().ToString('N')
          net user arrtest $pw /add /Y | Out-Null
          if ($LASTEXITCODE) { Fail 'cannot create the test user' }
          $user = "$env:COMPUTERNAME\arrtest"
          $dir = 'C:\ProgramData\arr-ci'
          New-Item -ItemType Directory -Force $dir | Out-Null
          icacls $dir /grant 'arrtest:(OI)(CI)F' | Out-Null
          try {
            Register-ScheduledTask -TaskName 'Arr tunnel' -Force -Description 'test' `
              -Action (New-ScheduledTaskAction -Execute 'cmd.exe' -Argument '/c ping -n 600 127.0.0.1 >nul') `
              -Trigger (New-ScheduledTaskTrigger -AtLogOn -User $user) `
              -Principal (New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Limited) | Out-Null
            # (1) Another account's boot task is refused, and nothing changes.
            $why = Set-TaskMode $user $true
            if ($why -ne 'Start at boot needs an administrator account; Arr will start when you log in.') { Fail "expected the refusal, got: $why" }
            if ("$((Get-ScheduledTask -TaskName 'Arr tunnel').Principal.LogonType)" -eq 'S4U') { Fail 'the refused step registered an S4U task' }
            # (2) The entry the installer adds, then the ordinary user stops and starts the task.
            $sid = (New-Object Security.Principal.NTAccount($user)).Translate([Security.Principal.SecurityIdentifier]).Value
            $svc = New-Object -ComObject Schedule.Service; $svc.Connect()
            $rt = $svc.GetFolder('\').GetTask('Arr tunnel')
            $rt.SetSecurityDescriptor($rt.GetSecurityDescriptor(4) + "(A;;FA;;;$sid)", 0)
            $script = "$dir\control.ps1"
            @(
              'try { Stop-ScheduledTask -TaskName "Arr tunnel" -ErrorAction Stop; "stopped" } catch { "stop failed: $_"; exit 3 }',
              'Start-Sleep -Seconds 2',
              'try { Start-ScheduledTask -TaskName "Arr tunnel" -ErrorAction Stop; "started" } catch { "start failed: $_"; exit 4 }'
            ) | Set-Content $script
            $cred = New-Object Management.Automation.PSCredential($user, (ConvertTo-SecureString $pw -AsPlainText -Force))
            $p = Start-Process powershell.exe -Credential $cred -WorkingDirectory $dir -Wait -PassThru -WindowStyle Hidden `
              -RedirectStandardOutput "$dir\control.out" -RedirectStandardError "$dir\control.err" `
              -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $script
            Get-Content "$dir\control.out", "$dir\control.err" -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { Fail "arrtest could not stop and start the task (exit code $($p.ExitCode))" }
            'start at boot, ordinary user: all checks passed'
          } finally {
            Unregister-ScheduledTask -TaskName 'Arr tunnel' -Confirm:$false -ErrorAction SilentlyContinue
            Get-Process ping -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            net user arrtest /delete | Out-Null
          }
      # The setup here in PowerShell, the way an agent runs a first install (ARR_YES and the values
      # it needs), against a stand-in for Plex: the config passes arr check, Arr starts and imports
      # the (empty) libraries, and a re-run keeps it. Before that: the config lookup and other pure
      # helpers; with nobody to answer and no Plex, a first install stops before installing anything
      # and names ARR_PLEX_URL, also with input redirected and no ARR_YES (instead of opening a setup
      # page nobody can answer); so do an address holding the token, a token Plex refuses and library
      # folders that aren't there (each named); and a busy port stops a first install, naming ARR_PORT.
      - name: Setup in PowerShell (first install without questions)
        shell: powershell
        run: |
          function Fail($m) { "FAIL: $m"; exit 1 }
          $text = Get-Content install.ps1 -Raw
          $i = $text.IndexOf("`ntry {`n`tInstall-Arr")
          if ($i -lt 0) { Fail 'cannot find the end of install.ps1' }
          Invoke-Expression $text.Substring(0, $i) # its functions, without running the installer
          $toml = "$env:RUNNER_TEMP\lookup.toml"
          [IO.File]::WriteAllText($toml, "[embedded]`nlisten = `"0.0.0.0:50413`"`n`n[server] # the API`n  listen = `"127.0.0.1:8799`" # its port`n`n[execution]`n# downloading`nenabled = true`n`n[library]`nmovies = `"D:\\Media\\Movies`"`nother = 'C:\x'`n")
          if ((Get-Conf $toml 'server' 'listen') -ne '127.0.0.1:8799') { Fail "server listen is $(Get-Conf $toml 'server' 'listen')" }
          if ((Get-Conf $toml 'execution' 'enabled') -ne 'true') { Fail 'execution enabled, after a comment line' }
          if ((Get-Conf $toml 'library' 'movies') -ne 'D:\Media\Movies') { Fail "library movies is $(Get-Conf $toml 'library' 'movies')" }
          if ((Get-Conf $toml 'library' 'other') -ne 'C:\x') { Fail 'a literal string' }
          if ($null -ne (Get-Conf $toml 'tmdb' 'enabled')) { Fail 'a missing section has a value' }
          if ((Toml-String 'D:\a "b"') -ne '"D:\\a \"b\""') { Fail "Toml-String gives $(Toml-String 'D:\a "b"')" }
          if ((Get-PlexUrl 'localhost:32400') -ne 'http://localhost:32400/') { Fail 'Get-PlexUrl without a scheme' }
          if ((Get-PlexUrl 'http://localhost:32400//') -ne 'http://localhost:32400/') { Fail 'Get-PlexUrl with slashes' }
          if ((Trim-Folder '"D:\Media\Movies\"') -ne 'D:\Media\Movies') { Fail 'Trim-Folder with quotes' }
          if ((Trim-Folder 'D:\') -ne 'D:\') { Fail 'Trim-Folder on a drive' }
          foreach ($bad in 'http://127.0.0.1:32400/web?X-Plex-Token=t', 'http://me:pw@127.0.0.1:32400', 'http://127.0.0.1:32400/#x') {
            $threw = $false
            try { $null = Get-PlexUrl $bad } catch { $threw = $true }
            if (-not $threw) { Fail "Get-PlexUrl took $bad" }
          }

          Start-Process python -ArgumentList '-m', 'http.server', '8994', '--bind', '127.0.0.1', '--directory', 'dist'
          $media = "$env:RUNNER_TEMP\arr terminal media"
          New-Item -ItemType Directory -Force "$media\Movies", "$media\TV Shows" | Out-Null
          $plexLog = "$env:RUNNER_TEMP\fakeplex.log"
          Start-Process python -ArgumentList 'tests\installer\fakeplex.py', '32497', 'ci-plex-token', "`"$media\Movies`"", "`"$media\TV Shows`"", "`"$plexLog`""
          Start-Sleep -Seconds 3
          $state = "$env:RUNNER_TEMP\arr terminal state"
          $bin = "$env:RUNNER_TEMP\arr terminal bin"
          $env:ARR_DOWNLOAD_BASE = 'http://127.0.0.1:8994'
          $env:ARR_BIN_DIR = $bin; $env:ARR_STATE_DIR = $state
          $env:ARR_INSTALL_STRICT = '1' # ARR_AUTO_UPDATE stays unset: updates must default to off

          # Nobody to answer and no Plex: nothing is installed, and the error names the variable.
          $env:ARR_YES = '1'; $env:ARR_PORT = '8791'; $env:ARR_PLEX_URL = 'http://127.0.0.1:32496'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "no Plex said: $msg"
          if ($msg -notmatch 'ARR_PLEX_URL') { Fail 'a first install with ARR_YES and no Plex did not name ARR_PLEX_URL' }
          if (Test-Path "$bin\arr.exe") { Fail 'it installed Arr before stopping' }

          # The same with input redirected, no ARR_YES and no setup values (which would choose the
          # setup here by themselves): no setup page that nobody can answer. (No Plex runs on
          # 32400 here: an earlier step removed it.)
          $env:ARR_YES = $null
          foreach ($v in 'ARR_PLEX_URL', 'ARR_PLEX_TOKEN', 'ARR_MOVIES', 'ARR_TV', 'ARR_MOVIE_SECTION', 'ARR_TV_SECTION',
              'ARR_DOWNLOADS', 'ARR_SEARCH_ONLY', 'ARR_TERMINAL', 'ARR_BROWSER') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          $empty = "$env:RUNNER_TEMP\empty.txt"
          Set-Content $empty ''
          $p = Start-Process powershell.exe -PassThru -NoNewWindow -RedirectStandardInput $empty `
            -RedirectStandardOutput "$env:RUNNER_TEMP\redirected.out" -RedirectStandardError "$env:RUNNER_TEMP\redirected.err" `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', "`"Get-Content '$pwd\install.ps1' -Raw | Invoke-Expression`""
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; Fail 'a redirected first install kept waiting (for a setup page?)' }
          $said = (Get-Content "$env:RUNNER_TEMP\redirected.out", "$env:RUNNER_TEMP\redirected.err" -ErrorAction SilentlyContinue) -join "`n"
          "redirected said: $said"
          if ($said -notmatch 'ARR_PLEX_URL') { Fail 'a redirected first install did not stop naming ARR_PLEX_URL' }
          if ($said -match 'in your web browser') { Fail 'a redirected first install went to the setup page' }
          if (Test-Path "$bin\arr.exe") { Fail 'the redirected first install installed Arr' }

          # An address copied from Plex Web, with the token in it: refused before anything is
          # installed or asked of Plex, and the token isn't shown.
          $env:ARR_YES = '1'; $env:ARR_PLEX_URL = 'http://127.0.0.1:32497/web/index.html?X-Plex-Token=ci-plex-token'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "address with a query said: $msg"
          if ($msg -notmatch 'ARR_PLEX_URL' -or $msg -notmatch 'only Plex') { Fail 'an address with a query was not refused' }
          if ("$msg".Contains('ci-plex-token')) { Fail 'the token in the address was shown' }
          if (Test-Path $plexLog) { Fail 'Plex was asked something before the address was refused' }
          if (Test-Path "$bin\arr.exe") { Fail 'it installed Arr before refusing the address' }

          # A token Plex refuses: found before anything is installed, naming ARR_PLEX_TOKEN.
          $env:ARR_PLEX_URL = 'http://127.0.0.1:32497'; $env:ARR_PLEX_TOKEN = 'not-the-token'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "refused token said: $msg"
          if ($msg -notmatch 'ARR_PLEX_TOKEN') { Fail 'a token Plex refuses was not named' }
          if ((Test-Path "$bin\arr.exe") -or (Test-Path $state)) { Fail 'it installed Arr before finding the token refused' }

          # Library folders that aren't on this computer: both named at once, before anything is installed.
          $env:ARR_PLEX_TOKEN = 'ci-plex-token'; $env:ARR_MOVIES = "$media\No Movies"; $env:ARR_TV = "$media\No TV"
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          "missing folders said: $msg"
          if ($msg -notmatch 'ARR_MOVIES' -or $msg -notmatch 'ARR_TV ') { Fail 'the missing library folders were not both named' }
          if ((Test-Path "$bin\arr.exe") -or (Test-Path $state)) { Fail 'it installed Arr before finding the folders missing' }
          Remove-Item Env:ARR_MOVIES, Env:ARR_TV

          # A busy port, with no Plex either: refused before anything is installed, naming the
          # port and ARR_PORT, before anything is said about Plex.
          $busy = New-Object Net.Sockets.TcpListener -ArgumentList ([Net.IPAddress]::Loopback), 8792
          $busy.Start()
          $env:ARR_PORT = '8792'; $env:ARR_PLEX_URL = 'http://127.0.0.1:32496'
          $msg = $null
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $msg = $_.Exception.Message }
          $busy.Stop()
          "busy port said: $msg"
          if ($msg -notmatch 'ARR_PORT' -or $msg -notmatch 'port 8792') { Fail 'a busy port was not refused naming the port and ARR_PORT' }
          if ($msg -match 'ARR_PLEX_URL') { Fail 'a busy port with no Plex was reported as a Plex problem' }
          if (Test-Path "$bin\arr.exe") { Fail 'it installed Arr before refusing the busy port' }

          # The first install: every answer from the variables or found (the folders Plex names,
          # the download folder next to the movies).
          $env:ARR_PORT = '8791'; $env:ARR_PLEX_URL = 'http://127.0.0.1:32497'
          Get-Content install.ps1 -Raw | Invoke-Expression
          $config = Get-Content "$state\config.toml" -Raw
          'config.toml:'; $config
          function Esc($s) { $s.Replace('\', '\\') }
          foreach ($want in 'listen = "127.0.0.1:8791"', 'base_url = "http://127.0.0.1:32497/"', 'token_file = "secrets/plex_token"',
              'movie_section = 1', 'tv_section = 2', "movies = `"$(Esc "$media\Movies")`"", "tv = `"$(Esc "$media\TV Shows")`"",
              "movies_path = `"$(Esc "$media\Movies")`"", "tv_path = `"$(Esc "$media\TV Shows")`"",
              "download_dir = `"$(Esc "$media\arr-downloads")`"", 'mode = "coexistence"') {
            if (-not $config.Contains($want)) { Fail "config lacks $want" }
          }
          if ($config -notmatch '(?m)^\[execution\]\r?\nenabled = true') { Fail 'downloading is not on' }
          if ($config.Contains('ci-plex-token')) { Fail 'the Plex token is in the config' }
          if ([IO.File]::ReadAllText("$state\secrets\plex_token") -ne 'ci-plex-token') { Fail 'the plex_token secret' }
          if (-not (Test-Path "$media\arr-downloads" -PathType Container)) { Fail 'no download folder' }
          if (-not (Test-Path "$state\default-indexers")) { Fail 'Knaben is not noted as offered' }
          if (Test-Path "$state\config.toml.new") { Fail 'config.toml.new was left behind' }
          & "$bin\arr.exe" check --config "$state\config.toml" | Out-Null
          if ($LASTEXITCODE) { Fail 'arr check rejects the config' }
          function Healthy { try { [bool](Invoke-RestMethod http://127.0.0.1:8791/api/v1/health -TimeoutSec 5) } catch { $false } }
          if (-not (Healthy)) { Fail 'Arr does not answer on 8791' }
          if ("$((Get-ScheduledTask -TaskName 'Arr').Principal.LogonType)" -eq 'S4U') { Fail 'Arr starts at boot, which nobody asked for' }
          if (Get-ScheduledTask -TaskName 'Arr update' -ErrorAction SilentlyContinue) { Fail 'automatic updates are on' }
          $asked = Get-Content $plexLog -Raw
          foreach ($want in 'GET /library/sections/1/all', 'GET /library/sections/2/all') {
            if (-not $asked.Contains($want)) { Fail "Arr never asked Plex for $want (no import)" }
          }

          # A re-run keeps the config, and says the setup values are only for a first setup.
          $before = [IO.File]::ReadAllText("$state\config.toml")
          $warned = Get-Content install.ps1 -Raw | Invoke-Expression 3>&1 | Out-String
          if ($warned -notmatch 'apply only to a first setup') { Fail "a re-run did not say the setup values are ignored: $warned" }
          if ([IO.File]::ReadAllText("$state\config.toml") -ne $before) { Fail 'a re-run changed the config' }
          if (-not (Healthy)) { Fail 'Arr does not answer after the re-run' }
          $env:ARR_REMOVE = 'arr'; $env:ARR_DELETE_DATA = '1'
          Get-Content uninstall.ps1 -Raw | Invoke-Expression
          if (Test-Path $state) { Fail 'the state folder is still there' }
          if (-not (Test-Path "$media\Movies")) { Fail 'uninstalling removed the media folder' }
          'setup in PowerShell: all checks passed'
