# Standalone example (placeholders only): native indexers, the embedded downloader, your own
# Plex library and metadata. Copy to STATE/config.toml (chmod 600). Credentials only as files
# under STATE/secrets (chmod 600). Policy comes from `arr setup` (see
# config/setup.example.toml). Relative paths resolve against the config file's directory.

[server]
listen = "127.0.0.1:8787"
allow_non_loopback = false
api_token_file = "secrets/api_token"
# Limits, defaults shown:
# max_body_bytes = 65536                 # 1024 to 1048576
# request_timeout_secs = 180             # 1 to 900
# max_concurrent_requests = 16           # 1 to 1024

[state]
dir = "."

# The Pirate Bay's JSON API, natively. Its magnets carry no trackers unless you list some,
# so the embedded engine below needs dht = true (or magnet_trackers, or initial_peers).
[[indexer]]
id = 1
name = "The Pirate Bay"
kind = "thepiratebay"
base_url = "https://apibay.org/"        # the exact API base URL you trust
recent_feed = true                      # RSS: precompiled/data_top100_recent.json
timeout_secs = 30
max_concurrent = 1
min_interval_ms = 2000                  # spacing between requests
cache_ttl_secs = 900
# magnet_trackers = ["udp://tracker.example:1337/announce"]   # public trackers only
# uploaders = ["trusted-uploader"]       # only results from these uploaders
# query_limit = 100                      # per limits_unit (Prowlarr queryLimit semantics)
# grab_limit = 20
# limits_unit = "day"

# Knaben's JSON search API: one query across several public trackers (The Pirate Bay among
# them). Same magnet rules as above. Only the search text is sent; nothing else.
[[indexer]]
id = 2
name = "Knaben"
kind = "knaben"
base_url = "https://api.knaben.org/"
# recent_feed = false                   # RSS: Knaben's latest releases (off by default)
# magnet_trackers = ["udp://tracker.example:1337/announce"]   # public trackers only

# A generic Torznab endpoint (spec 1.3), e.g. a self-hosted Jackett indexer.
# [[indexer]]
# id = 3
# name = "Torznab example"
# kind = "torznab"
# base_url = "http://127.0.0.1:9117/api/v2.0/indexers/example/results/torznab/"
# api_key_file = "secrets/indexer_3_api_key"   # sent only to base_url's origin
# api_path = "api"
# download_origins = ["https://downloads.example"]   # .torrent links elsewhere (no key sent)
# key_origins = ["https://tracker.example"]          # may receive the key in announce URLs
# prowlarr_definition = "example"                    # stands in for this imported definition
# max_pages = 2
# page_size = 100

[tvmaze]
enabled = true
base_url = "https://api.tvmaze.com"

# Optional backup for movies (movies come from the Plex sign-in): add a free TMDB key.
[tmdb]
enabled = true
base_url = "https://api.themoviedb.org"
credential_file = "secrets/tmdb_credential"

[execution]
enabled = false            # enable deliberately after `check` and readiness pass
download_cleanup = true

# Overrides the RSS interval from `arr setup` (rss_sync_interval_minutes) for both kinds.
# [automation]
# rss_interval_minutes = 15  # 10 to 1440; 0 turns RSS off

# Opt-in error reports (docs/PRIVACY.md); off without this section.
# [reporting]
# enabled = true

[embedded]
download_dir = "/srv/arr/downloads"
listen = "0.0.0.0:6881"
trackers = true
dht = true                 # public trackerless magnets; private torrents never use the DHT
local_discovery = false
max_active_downloads = 3
# upload_limit_bytes_per_sec = 524288     # 512 KiB/s for all torrents; leave out for no limit
# download_limit_bytes_per_sec = 10485760 # 10 MiB/s; leave out for no limit
# ratio_limit = 2.0       # share limits when no seed goal applies
# seeding_time_limit_minutes = 4320

[migration]
# Still written so a rolled-back older release (which requires it) keeps working;
# "coexistence" is the only mode.
mode = "coexistence"

[library]
movies = "/srv/media/movies"
tv = "/srv/media/tv"
ffprobe = "/usr/bin/ffprobe"   # external dependency: apt install ffmpeg (Debian/Ubuntu)

[plex]
base_url = "http://127.0.0.1:32400"
token_file = "secrets/plex_token"
movie_section = 1
tv_section = 2
movies_path = "/data/movies"   # [library] movies as Plex sees it
tv_path = "/data/tv"           # [library] tv as Plex sees it

# Remote MCP (Streamable HTTP, static bearer token; no TLS: put an HTTPS proxy in front for
# anything beyond loopback, see docs/MCP.md).
# [mcp]
# enabled = true
# token_file = "secrets/mcp_token"
# allowed_hosts = ["localhost", "127.0.0.1"]
# allowed_origins = []
# max_body_bytes = 65536
# max_concurrent = 4
# timeout_secs = 120
#
# Optional OAuth 2.1 sign-in with Google for connectors such as ChatGPT (docs/MCP.md). When
# present, /mcp also accepts OAuth access tokens issued after a Google sign-in.
# [mcp.oauth]
# public_url = "https://media.example.org"   # https origin only; its host must be in allowed_hosts
# google_client_id = "1234567890-abc.apps.googleusercontent.com"
# google_client_secret_file = "secrets/google_client_secret"   # 0600
# allowed_emails = ["you@example.com"]       # 1 to 32 exact addresses, case-insensitive
# # Optional, defaults shown. All URLs must be https (http only for loopback hosts).
# trusted_client_metadata = ["https://chatgpt.com/oauth/"]   # client_id URL prefixes trusted
# google_authorization_endpoint = "https://accounts.google.com/o/oauth2/v2/auth"
# google_token_endpoint = "https://oauth2.googleapis.com/token"
# access_token_ttl_secs = 3600
# refresh_token_ttl_days = 30
